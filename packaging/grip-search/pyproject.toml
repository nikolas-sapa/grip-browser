[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grip-search"
version = "0.2.0"
description = "Agent-grade retrieval on top of grip: a question in, ranked cited passages out"
readme = "../../gripsearch/README.md"
requires-python = ">=3.11"
dependencies = [
    "grip-browser>=0.4.0",
]

[tool.hatch.build.targets.wheel]
force-include = { "../../gripsearch" = "gripsearch" }
