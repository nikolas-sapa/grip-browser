[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grip-browser"
version = "0.3.0"
description = "Token-efficient, CDP-native browser SDK for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "mypy>=1.10",
    "ruff>=0.4",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["grip"]

[tool.hatch.build.targets.sdist]
# Without this the sdist tars the whole repo, so `gripsearch` — a separate
# distribution — would ship inside grip-browser. The wheel's `packages` filter
# does not apply to sdists.
only-include = ["grip", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
