[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grip-browser"
version = "0.5.1"
description = "Token-efficient, CDP-native browser SDK for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
# 2.0 dropped the 1.x low-level decorators (@server.list_tools/@server.call_tool)
# in favour of MCPServer.tool; grip.mcp.server is written against the 2.x surface,
# so an older floor would resolve to a version that cannot run it.
mcp = ["mcp>=2.0.0"]

[project.scripts]
grip-mcp = "grip.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["grip"]

[tool.hatch.build.targets.sdist]
# Without this the sdist tars the whole repo, so `gripsearch` — a separate
# distribution — would ship inside grip-browser. The wheel's `packages` filter
# does not apply to sdists.
only-include = ["grip", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit select, because ruff's default is pyflakes-only: the CI job read as a
# clean slate while 105 real findings sat outside the default rule set.
select = ["E", "F", "B", "ASYNC", "S", "RUF", "ARG", "SIM", "PTH"]
ignore = [
    "S101",     # assert is fine in tests and internal invariants
    "TRY003",   # long messages inside raise are deliberate here
    # Every flagged function already bounds itself (asyncio.timeout, or a
    # monotonic deadline threaded through a poll loop). The rule's remedy is to
    # delete the parameter and make callers wrap the call, which is a public API
    # grip deliberately does not have: goto/read/solve_challenge all take one.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
# The confusable table IS homoglyphs; flagging them is the module working.
"grip/security/injection.py" = ["RUF001", "RUF003"]
# Timing and path jitter shaped to look human. Never a secret.
"grip/input.py" = ["S311"]
"tests/**" = ["S", "ARG", "B"]
"benchmarks/**" = ["S", "T201"]
"evaluation/**" = ["S", "T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tiktoken", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
