name: Bug report
description: Report a bug or unexpected behavior in grip
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code snippet or steps that trigger the bug.
      render: python
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / traceback
      render: shell

  - type: input
    id: grip-version
    attributes:
      label: grip-browser version
      placeholder: e.g. 0.2.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.11.9
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome/Chromium version
      placeholder: e.g. 126.0.6478.126
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.1, Ubuntu 24.04
