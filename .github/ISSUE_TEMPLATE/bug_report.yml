name: Bug report
description: Report a bug or unexpected behavior in grip
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package are you seeing this in?
      options:
        - grip-browser
        - grip-search
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code snippet or steps that trigger the bug.
      render: python
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / traceback
      render: shell

  - type: input
    id: grip-version
    attributes:
      label: Package version
      placeholder: e.g. grip-browser 0.3.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.11.9
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome/Chromium version
      placeholder: e.g. 126.0.6478.126
    validations:
      required: true

  - type: dropdown
    id: chrome-source
    attributes:
      label: How was Chrome installed
      description: Where did the Chrome/Chromium binary grip is launching come from?
      options:
        - System install (e.g. /Applications, /usr/bin)
        - Playwright's cached Chrome for Testing
        - Puppeteer's cached Chrome for Testing
        - CHROME_EXECUTABLE pointing at a custom binary
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: headless
    attributes:
      label: Headless
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.1, Ubuntu 24.04
    validations:
      required: true
