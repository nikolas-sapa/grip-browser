name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v

      # Integration and gripsearch tests drive real Chrome. They are offline —
      # every one serves its own fixtures from a local http.server — but they need
      # a browser binary, which ubuntu-latest runners ship.
      - name: Run integration and gripsearch tests
        run: pytest tests/integration/ tests/gripsearch/ -v
