name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v

      # Integration and gripsearch tests drive real Chrome. They are offline —
      # every one serves its own fixtures from a local http.server — but they need
      # a browser binary, which ubuntu-latest runners ship.
      - name: Run integration and gripsearch tests
        run: pytest tests/integration/ tests/gripsearch/ -v

  lint:
    runs-on: ubuntu-latest
    # A ratchet, not a gate. grip/ carries a pre-existing backlog of 39 ruff and
    # 10 mypy findings that predate this job, so demanding zero would fail on
    # arrival and get ignored. Demanding "no worse than the backlog" catches the
    # thing that actually matters — a change that adds new findings — and the
    # numbers below come down as the backlog is cleared. gripsearch/, evaluation/
    # and benchmarks/ are clean and are held to zero.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff (grip backlog must not grow)
        run: |
          BASELINE=39
          COUNT=$(ruff check grip/ --output-format=concise | grep -c "^grip/" || true)
          echo "ruff findings in grip/: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::ruff findings rose from $BASELINE to $COUNT"
            ruff check grip/ --output-format=concise
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::backlog is down to $COUNT — lower BASELINE in this workflow"
          fi

      - name: ruff (everything else must stay clean)
        if: always()
        run: ruff check gripsearch/ evaluation/ benchmarks/

      - name: mypy (grip backlog must not grow)
        if: always()
        run: |
          BASELINE=10
          COUNT=$(mypy grip/ --no-error-summary 2>/dev/null | grep -c "error:" || true)
          echo "mypy errors in grip/: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::mypy errors rose from $BASELINE to $COUNT"
            mypy grip/
            exit 1
          fi

      - name: mypy (gripsearch must stay clean)
        if: always()
        run: mypy gripsearch/
