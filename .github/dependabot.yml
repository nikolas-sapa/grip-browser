# Cooldown mirrors ~/.npmrc's minimum-release-age=10080 (7 days): a release
# younger than that is refused by npm locally, so proposing it here only
# produces PRs that pass CI and then break `npm install` on a dev machine.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # ESLint 10 breaks the eslint-plugin-react bundled inside
      # eslint-config-next (resolveBasedir calls context.getFilename, removed
      # in 10). Nothing here can fix it; drop this once Next ships support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime, not the newest release: CI and Vercel
      # run Node 22, so types for 26 would type-check APIs that are not there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # upload-artifact and download-artifact must move together: their v4/v7
      # and v7/v8 backends are not interchangeable, so a PR bumping one half
      # leaves a workflow that uploads a dist the next job cannot find.
      # Grouping them means the bump arrives as one reviewable change once
      # both halves have a matching major.
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
